<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Panneau — Sorties dans les Bouches-du-Rhône</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#cdae78;
    --board-groove:#b6935c;
    --paper:#f7efdc;
    --paper-shadow:#00000030;
    --ink:#2c2317;
    --ink-soft:#5a4c38;
    --ochre:#c25a25;
    --lavender:#6c5b8f;
    --cyprus:#3f5c44;
    --azure:#2c6b86;
    --pin:#8a2f22;
    --paper-alt:#f0e6cd;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{height:100%;}
  .app{
    font-family:'Fraunces',serif;
    color:var(--ink);
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .content{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    position:relative;
    background:
      repeating-linear-gradient(90deg, var(--board) 0 3px, var(--board-groove) 3px 4px),
      radial-gradient(circle at 10% 20%, #00000012 0, transparent 40%),
      radial-gradient(circle at 80% 60%, #00000010 0, transparent 45%);
  }
  .content.mode-scroll{overflow:hidden; background:#0c0c0c;}
  .topbar{
    flex:0 0 auto;
    z-index:40;
    background:linear-gradient(180deg, #241a10 0%, #1a130b 100%);
    color:#f3e6c8;
    padding:18px 24px 14px;
    box-shadow:0 4px 12px #00000055;
  }
  .brand-row{display:flex; align-items:center; justify-content:space-between; max-width:1100px; margin:0 auto; flex-wrap:wrap; gap:8px;}
  .mode-toggle{display:flex; gap:6px;}
  .mode-pill.active{background:var(--cyprus); border-color:var(--cyprus); color:#fff8ec;}
  .brand{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:900;
    font-size:34px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#f3e6c8;
    display:flex; align-items:center; gap:10px;
  }
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--ochre); box-shadow:0 0 0 3px #f3e6c822;}
  .tagline{font-family:'Space Mono',monospace; font-size:12px; color:#c9b78f; letter-spacing:0.5px;}
  .filters{
    max-width:1100px; margin:14px auto 0; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .filters select, .filters input[type=text]{
    font-family:'Space Mono',monospace;
    background:#2f2416; color:#f3e6c8; border:1px solid #4a3a24;
    padding:8px 10px; border-radius:3px; font-size:13px;
  }
  .pill{
    font-family:'Space Mono',monospace; font-size:12px; padding:6px 12px; border-radius:20px;
    border:1px solid #4a3a24; background:#2f2416; color:#e6d6ae; cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .pill.active{background:var(--ochre); color:#fff8ec; border-color:var(--ochre); transform:translateY(-1px);}
  .pill:hover{transform:translateY(-1px);}
  .sort-toggle{margin-left:auto; display:flex; gap:6px;}

  .board{max-width:1100px; margin:34px auto; padding:0 24px 90px; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:30px 26px;}

  .flyer{
    position:relative;
    background:var(--paper);
    padding:16px 16px 14px;
    box-shadow:0 10px 18px -6px var(--paper-shadow), 0 2px 4px #0000002a;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .flyer::before{
    content:"";
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d4664f, var(--pin) 70%);
    box-shadow:0 3px 4px #00000060;
  }
  .flyer:nth-child(3n){transform:rotate(-2.4deg);}
  .flyer:nth-child(3n+1){transform:rotate(1.6deg);}
  .flyer:nth-child(3n+2){transform:rotate(-1deg);}
  .flyer:hover{transform:rotate(0deg) translateY(-3px) scale(1.015); box-shadow:0 16px 26px -8px #00000045;}

  .flyer-cat{
    display:inline-block; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1px;
    text-transform:uppercase; color:#fff; padding:3px 8px; margin-bottom:10px;
  }
  .cat-Marché{background:var(--cyprus);}
  .cat-Concert{background:var(--lavender);}
  .cat-Fête{background:var(--ochre);}
  .cat-Nature{background:var(--azure);}
  .cat-Expo{background:#8a6b3f;}
  .cat-Feu{background:var(--pin);}

  .flyer h3{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700; font-size:23px; line-height:1.05; margin:0 0 8px;
    text-transform:uppercase; letter-spacing:0.3px;
  }
  .flyer .meta{font-family:'Space Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin-bottom:10px; line-height:1.6;}
  .flyer .desc{font-size:14px; color:var(--ink-soft); line-height:1.4; margin-bottom:14px; font-style:italic;}
  .flyer-foot{display:flex; align-items:center; justify-content:space-between; border-top:1px dashed #00000030; padding-top:10px;}
  .vote-btn{
    display:flex; align-items:center; gap:6px; background:none; border:1px solid var(--ink);
    padding:5px 10px; border-radius:20px; cursor:pointer; font-family:'Space Mono',monospace;
    font-size:12px; color:var(--ink); transition:all .15s ease;
  }
  .vote-btn.voted{background:var(--ochre); border-color:var(--ochre); color:#fff8ec;}
  .vote-btn:hover{transform:scale(1.05);}
  .vote-btn:disabled{opacity:0.5; cursor:default;}
  .comment-count{font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-soft);}

  .empty{grid-column:1/-1; text-align:center; padding:60px 20px; font-family:'Space Mono',monospace; color:#5a4c3899;}
  .seed-btn{
    margin-top:14px; background:var(--cyprus); color:#fff8ec; border:none; padding:9px 16px; border-radius:20px;
    font-family:'Space Mono',monospace; font-size:12px; cursor:pointer;
  }

  .fab{
    position:fixed; bottom:26px; right:26px; z-index:50;
    background:var(--ochre); color:#fff8ec; border:none; border-radius:50px;
    padding:16px 22px; font-family:'Big Shoulders Display',sans-serif; font-weight:700;
    font-size:16px; letter-spacing:0.5px; text-transform:uppercase; cursor:pointer;
    box-shadow:0 8px 18px #00000055; display:flex; align-items:center; gap:8px;
    transition:transform .15s ease;
  }
  .fab:hover{transform:translateY(-2px) scale(1.03);}

  .overlay{position:fixed; inset:0; background:#1a130bcc; z-index:60; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{
    background:var(--paper); max-width:520px; width:100%; max-height:85vh; overflow-y:auto;
    padding:26px 26px 22px; position:relative; box-shadow:0 20px 50px #00000070;
  }
  .modal h2{font-family:'Big Shoulders Display',sans-serif; text-transform:uppercase; font-size:26px; margin:6px 0 12px;}
  .modal .close{position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft); font-family:'Space Mono',monospace;}
  .modal label{display:block; font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); margin:14px 0 5px;}
  .modal input, .modal select, .modal textarea{
    width:100%; font-family:'Fraunces',serif; font-size:14px; padding:8px 10px; border:1px solid #b6935c88; background:#fffdf6; border-radius:2px;
  }
  .modal textarea{resize:vertical; min-height:70px;}
  .modal .submit{
    margin-top:18px; background:var(--cyprus); color:#fff8ec; border:none; padding:10px 18px; border-radius:3px;
    font-family:'Big Shoulders Display',sans-serif; font-size:15px; text-transform:uppercase; letter-spacing:0.5px; cursor:pointer;
  }
  .modal .submit:disabled{opacity:0.6; cursor:default;}
  .detail-meta{font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:12px; line-height:1.7;}
  .detail-desc{font-size:15px; line-height:1.5; margin-bottom:18px;}
  .comments{border-top:1px dashed #00000030; padding-top:14px;}
  .comment{font-size:13.5px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid #00000012;}
  .comment .who{font-family:'Space Mono',monospace; font-size:11px; color:var(--azure); margin-right:6px;}
  .comment-form{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .comment-form input{flex:1;}
  .comment-form input.comment-name{flex:0 0 100px;}
  .comment-form button{background:var(--azure); color:#fff; border:none; padding:0 14px; border-radius:2px; font-family:'Space Mono',monospace; cursor:pointer;}

  .scrollFeed{
    display:none;
    height:100%;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
  }
  .content.mode-scroll .scrollFeed{display:block;}
  .content.mode-scroll .board{display:none;}

  .scroll-card{
    position:relative;
    height:100%;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:26px 84px 64px 26px;
    color:#fff8ec;
    overflow:hidden;
    touch-action:pan-y;
  }
  .scroll-card::before{
    content:attr(data-emoji);
    position:absolute; top:-40px; right:-30px;
    font-size:260px; opacity:0.16; line-height:1;
    transform:rotate(-8deg);
    pointer-events:none;
    z-index:0;
  }
  .sc-Marché{background:radial-gradient(circle at 30% 20%, #5c8a63, var(--cyprus) 70%);}
  .sc-Concert{background:radial-gradient(circle at 30% 20%, #8f7cb8, var(--lavender) 70%);}
  .sc-Fête{background:radial-gradient(circle at 30% 20%, #e07f43, var(--ochre) 70%);}
  .sc-Nature{background:radial-gradient(circle at 30% 20%, #4b93b3, var(--azure) 70%);}
  .sc-Expo{background:radial-gradient(circle at 30% 20%, #b08c53, #8a6b3f 70%);}
  .sc-Feu{background:radial-gradient(circle at 30% 20%, #c14f3c, var(--pin) 70%);}

  .scroll-media{position:absolute; inset:0; z-index:0;}
  .media-strip{
    display:flex; height:100%; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; touch-action:pan-x;
    scrollbar-width:none;
  }
  .media-strip::-webkit-scrollbar{display:none;}
  .media-slide{
    flex:0 0 100%; height:100%; scroll-snap-align:start;
    background-size:cover; background-position:center;
  }
  .scroll-overlay-gradient{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, #00000010 0%, #000000b5 78%);
  }
  .media-dots{
    position:absolute; top:56px; left:26px; right:26px; z-index:2;
    display:flex; gap:5px; justify-content:center;
  }
  .media-dots .dot{flex:1; max-width:36px; height:3px; border-radius:2px; background:#ffffff45;}
  .media-dots .dot.active{background:#fff8ec;}

  .scroll-top{position:absolute; top:20px; left:26px; right:26px; z-index:3; display:flex; justify-content:space-between; align-items:center;}
  .scroll-counter{font-family:'Space Mono',monospace; font-size:12px; background:#00000040; padding:5px 10px; border-radius:20px;}
  .scroll-cat-tag{font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:1px; background:#00000040; padding:5px 10px; border-radius:20px;}

  .scroll-card h2, .scroll-card .scroll-meta, .scroll-card .scroll-desc, .scroll-card .desc-toggle, .scroll-card .scroll-hint{position:relative; z-index:3;}

  .scroll-card h2{
    font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:44px; line-height:1.02;
    text-transform:uppercase; margin:0 0 12px; text-shadow:0 3px 10px #00000055; max-width:80%;
  }
  .scroll-meta{font-family:'Space Mono',monospace; font-size:13px; margin-bottom:10px; opacity:0.92; line-height:1.7;}
  .scroll-desc{font-size:16px; line-height:1.5; max-width:78%; font-style:italic; text-shadow:0 2px 6px #00000040;}
  .desc-toggle{
    background:none; border:none; color:#f3e6c8; font-family:'Space Mono',monospace; font-size:12px;
    text-decoration:underline; padding:6px 0 0; cursor:pointer; opacity:0.9;
  }
  .desc-toggle:hover{opacity:1;}

  .scroll-actions{
    position:absolute; right:14px; bottom:70px; z-index:3; display:flex; flex-direction:column; gap:18px; align-items:center;
  }
  .scroll-action-btn{
    background:#00000045; border:1px solid #ffffff40; color:#fff8ec; border-radius:50%;
    width:52px; height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:20px; cursor:pointer; gap:2px;
  }
  .scroll-action-btn span{font-family:'Space Mono',monospace; font-size:10.5px;}
  .scroll-action-btn.voted{background:var(--ochre); border-color:var(--ochre);}

  .scroll-hint{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    font-family:'Space Mono',monospace; font-size:11px; text-align:center; opacity:0.85;
    animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,-6px);}}

  @media (max-width: 640px){
    .topbar{padding:14px 14px 12px;}
    .brand{font-size:26px;}
    .tagline{font-size:10.5px;}
    .filters{gap:7px;}
    .pill{padding:5px 10px; font-size:11px;}
    .filters select{padding:6px 8px; font-size:12px;}
    .sort-toggle{margin-left:0; width:100%;}
    .board{padding:0 14px 90px; margin:22px auto; grid-template-columns:1fr; gap:24px;}
    .flyer:nth-child(n){transform:rotate(0deg);}
    .flyer:hover{transform:translateY(-2px);}
    .flyer h3{font-size:20px;}
    .fab{bottom:16px; right:16px; left:16px; justify-content:center; padding:14px 18px;}
    .modal{padding:22px 18px 18px; max-height:90vh;}
    .modal h2{font-size:22px;}
    .overlay{padding:0; align-items:flex-end;}
    .modal{max-width:100%; border-radius:8px 8px 0 0;}
    .scroll-card{padding:22px 70px 56px 18px;}
    .scroll-card h2{font-size:32px; max-width:100%;}
    .scroll-desc{max-width:100%; font-size:14px;}
    .scroll-card::before{font-size:180px;}
    .scroll-actions{right:8px; bottom:60px; gap:14px;}
    .scroll-action-btn{width:44px; height:44px; font-size:17px;}

    .topbar{display:none;}
    .board{display:none !important;}
    .scrollFeed{display:block !important;}
    .fab{display:none;}
    .scroll-card{padding-top:20px;}
  }
  @media (max-width: 380px){
    .brand{font-size:22px;}
    .flyer h3{font-size:18px;}
  }

  .scroll-card.has-media::before{content:none;}
  .flyer-img{width:100%; height:130px; object-fit:cover; display:block; margin:-16px -16px 12px;}

  .img-drop{
    margin-top:6px; border:1.5px dashed #b6935c88; border-radius:4px; padding:14px; text-align:center;
    font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-soft); cursor:pointer; background:#fffdf6;
  }
  .img-drop:hover{border-color:var(--ochre); color:var(--ochre);}
  .img-preview-wrap{margin-top:8px; display:flex; flex-wrap:wrap; gap:8px;}
  .img-thumb{position:relative; width:72px; height:72px;}
  .img-thumb img{width:100%; height:100%; object-fit:cover; display:block; border-radius:3px;}
  .img-thumb button{
    position:absolute; top:-6px; right:-6px; background:#1a130bcc; color:#fff8ec; border:none; border-radius:50%;
    width:20px; height:20px; cursor:pointer; font-size:11px; line-height:1;
  }

  .config-warning{
    position:fixed; top:0; left:0; right:0; z-index:200;
    background:#8a2f22; color:#fff8ec; font-family:'Space Mono',monospace; font-size:12px;
    padding:10px 16px; text-align:center; line-height:1.5;
  }
  .config-warning code{background:#00000040; padding:1px 5px; border-radius:2px;}

  #adminZone{display:flex; align-items:center; gap:6px;}
  .admin-badge{
    position:relative; background:var(--pin); color:#fff8ec; border-color:var(--pin);
  }
  .admin-badge .count{
    position:absolute; top:-6px; right:-6px; background:#fff8ec; color:var(--pin);
    border-radius:50%; width:16px; height:16px; font-size:10px; display:flex; align-items:center; justify-content:center;
  }
  .mod-item{
    background:var(--paper); padding:12px 14px; margin-bottom:10px; border-radius:3px;
    box-shadow:0 2px 6px #00000020;
  }
  .mod-item h4{margin:0 0 4px; font-family:'Big Shoulders Display',sans-serif; font-size:18px; text-transform:uppercase;}
  .mod-item .mod-meta{font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-soft); margin-bottom:8px;}
  .mod-item .mod-desc{font-size:13.5px; margin-bottom:10px; color:var(--ink-soft);}
  .mod-actions{display:flex; gap:8px;}
  .mod-actions button{
    flex:1; border:none; border-radius:3px; padding:8px; font-family:'Space Mono',monospace; font-size:12px; cursor:pointer;
  }
  .mod-approve{background:var(--cyprus); color:#fff8ec;}
  .mod-reject{background:#00000015; color:var(--ink);}
  .login-form{display:flex; flex-direction:column; gap:8px;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand-row">
      <div>
        <div class="brand"><span class="dot"></span>Le Panneau</div>
        <div class="tagline">sorties &amp; bons plans — Bouches-du-Rhône</div>
      </div>
      <div class="mode-toggle">
        <button class="pill mode-pill" id="modeBoard">📌 Panneau</button>
        <button class="pill mode-pill" id="modeScroll">📱 Scroll</button>
        <div id="adminZone"></div>
      </div>
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="content" id="content">
    <div class="board" id="board"></div>
    <div class="scrollFeed" id="scrollFeed"></div>
  </div>
</div>

<button class="fab" id="openPublish">✎ Publier une sortie</button>

<div id="modalRoot"></div>

let app, db, auth, currentUid = null, isAdmin = false;
let pendingSorties = [];
let sorties = [];
let activeCat = "Toutes";
let activeVille = "Toutes";
let sortMode = "date";
let viewMode = "board";
let expandedIds = new Set();

function showConfigWarning(msg){
  let el = document.getElementById('configWarning');
  if(!el){
    el = document.createElement('div');
    el.id = 'configWarning';
    el.className = 'config-warning';
    document.body.prepend(el);
  }
  el.innerHTML = '⚠️ ' + msg;
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function startListening(){
  const q = query(collection(db,'sorties'), where('status','==','published'), where('date','>=', todayStr()), orderBy('date','asc'));
  onSnapshot(q, snap=>{
    sorties = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, err=>{
    console.error(err);
    showConfigWarning("Erreur Firestore : " + err.message + ". Vérifie les règles de sécurité et que l'index existe (le lien pour le créer apparaît dans la console du navigateur).");
  });
}

function startPendingListening(){
  const q = query(collection(db,'sorties'), where('status','==','pending'), orderBy('createdAt','desc'));
  onSnapshot(q, snap=>{
    pendingSorties = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderAdminBadge();
    if(document.getElementById('modOverlay')) renderModPanel();
  }, err=>{
    console.error(err);
  });
}

function updateAdminState(user){
  isAdmin = !!(user && !user.isAnonymous && user.uid === ADMIN_UID);
  renderAdminBadge();
  if(isAdmin) startPendingListening();
  else pendingSorties = [];
}

if(CONFIG_READY){
  app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);
  onAuthStateChanged(auth, user=>{
    if(user){
      currentUid = user.uid;
      updateAdminState(user);
      startListening();
      render();
    } else {
      signInAnonymously(auth).catch(err=>{
        console.error(err);
        showConfigWarning("Connexion Firebase impossible : " + err.message);
      });
    }
  });
} else {
  showConfigWarning("Configure ta clé Firebase dans le &lt;script&gt; (objet <code>firebaseConfig</code>) pour activer la sauvegarde. Sans ça, rien n'est persistant.");
}

function catClass(c){ return "cat-" + c; }

function getFilteredList(){
  let list = sorties.filter(s=>
    (activeCat==='Toutes' || s.cat===activeCat) &&
    (activeVille==='Toutes' || s.ville===activeVille)
  );
  if(sortMode==='hot') list = list.slice().sort((a,b)=>(b.votedBy||[]).length-(a.votedBy||[]).length);
  else list = list.slice().sort((a,b)=>a.date.localeCompare(b.date));
  return list;
}

function renderModeToggle(){
  document.getElementById('modeBoard').classList.toggle('active', viewMode==='board');
  document.getElementById('modeScroll').classList.toggle('active', viewMode==='scroll');
  document.getElementById('content').classList.toggle('mode-scroll', viewMode==='scroll');
}

function renderFilters(){
  const el = document.getElementById('filters');
  let html = `<button class="pill ${activeCat==='Toutes'?'active':''}" data-cat="Toutes">Toutes</button>`;
  CATS.forEach(c=>{
    html += `<button class="pill ${activeCat===c?'active':''}" data-cat="${c}">${c}</button>`;
  });
  html += `<select id="villeSelect">
    <option value="Toutes">Toutes les villes</option>
    ${VILLES.map(v=>`<option value="${v}" ${activeVille===v?'selected':''}>${v}</option>`).join('')}
  </select>`;
  html += `<div class="sort-toggle">
    <button class="pill ${sortMode==='hot'?'active':''}" data-sort="hot">🔥 Hot</button>
    <button class="pill ${sortMode==='date'?'active':''}" data-sort="date">📅 Date</button>
  </div>`;
  el.innerHTML = html;

  el.querySelectorAll('[data-cat]').forEach(btn=>{
    btn.onclick = ()=>{ activeCat = btn.dataset.cat; render(); };
  });
  el.querySelectorAll('[data-sort]').forEach(btn=>{
    btn.onclick = ()=>{ sortMode = btn.dataset.sort; render(); };
  });
  document.getElementById('villeSelect').onchange = (e)=>{ activeVille = e.target.value; render(); };
}

async function seedDemoData(){
  if(!isAdmin){ alert("Connecte-toi en admin pour importer les exemples."); return; }
  try{
    for(const item of DEMO_SORTIES){
      await addDoc(collection(db,'sorties'), {
        ...item, status:'published', votedBy:[], commentaires:[], createdAt: serverTimestamp()
      });
    }
  }catch(err){
    console.error(err);
    showConfigWarning("Erreur à l'import : " + err.message + " (uid actuel : " + currentUid + ", isAdmin=" + isAdmin + ")");
    const b = document.getElementById('seedBtn');
    if(b){ b.disabled = false; b.textContent = "＋ Importer 9 sorties d'exemple"; }
  }
}

function emptyStateHtml(forScroll){
  const btn = isAdmin
    ? `<button class="seed-btn" id="seedBtn">＋ Importer 9 sorties d'exemple</button>`
    : CONFIG_READY
      ? `<div style="margin-top:10px; opacity:0.8;">Publie une sortie, elle apparaîtra ici une fois validée.</div>`
      : `<div style="margin-top:10px; opacity:0.8;">Configure Firebase pour publier des sorties.</div>`;
  if(forScroll){
    return `<div class="scroll-card sc-Marché" data-emoji="🧺" style="justify-content:center; align-items:center; text-align:center;">
      <div><h2 style="max-width:100%;">Rien ici</h2><div class="scroll-desc" style="max-width:100%;">Change de filtre ou publie la première sortie.</div>${btn}</div>
    </div>`;
  }
  return `<div class="empty">Aucune sortie ici pour l'instant.<br>Sois le premier à en publier une.<br>${btn}</div>`;
}

function bindSeedBtn(el){
  const b = el.querySelector('#seedBtn');
  if(b) b.onclick = ()=>{ b.disabled = true; b.textContent = 'Import en cours...'; seedDemoData(); };
}

function renderAdminBadge(){
  const el = document.getElementById('adminZone');
  if(!el) return;
  if(isAdmin){
    el.innerHTML = `
      <button class="pill admin-badge" id="modBtn">🛡️ Modération${pendingSorties.length ? `<span class="count">${pendingSorties.length}</span>` : ''}</button>
      <button class="pill" id="logoutBtn">Déconnexion</button>
    `;
    document.getElementById('modBtn').onclick = openModPanel;
    document.getElementById('logoutBtn').onclick = ()=>{
      signOut(auth).then(()=> signInAnonymously(auth));
    };
  } else {
    el.innerHTML = `<button class="pill" id="adminLoginBtn">🔑 Admin</button>`;
    document.getElementById('adminLoginBtn').onclick = openLoginForm;
  }
}

function openLoginForm(){
  document.getElementById('modalRoot').innerHTML = `
  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="close" id="closeModal">✕ fermer</button>
      <h2>Connexion admin</h2>
      <div class="login-form">
        <label>Email</label><input type="email" id="adm-email">
        <label>Mot de passe</label><input type="password" id="adm-pass">
        <button class="submit" id="adm-submit">Se connecter</button>
        <div id="adm-error" style="color:var(--pin); font-family:'Space Mono',monospace; font-size:12px;"></div>
      </div>
    </div>
  </div>`;
  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };
  document.getElementById('closeModal').onclick = closeModal;
  document.getElementById('adm-submit').onclick = ()=>{
    const email = document.getElementById('adm-email').value.trim();
    const pass = document.getElementById('adm-pass').value;
    signInWithEmailAndPassword(auth, email, pass)
      .then(()=> closeModal())
      .catch(err=>{ document.getElementById('adm-error').textContent = "Échec : " + err.message; });
  };
}

function openModPanel(){
  document.getElementById('modalRoot').innerHTML = `
  <div class="overlay" id="modOverlay">
    <div class="modal">
      <button class="close" id="closeModal">✕ fermer</button>
      <h2>Modération</h2>
      <div id="modList"></div>
    </div>
  </div>`;
  document.getElementById('modOverlay').onclick = (e)=>{ if(e.target.id==='modOverlay') closeModal(); };
  document.getElementById('closeModal').onclick = closeModal;
  renderModPanel();
}

function renderModPanel(){
  const el = document.getElementById('modList');
  if(!el) return;
  if(pendingSorties.length===0){
    el.innerHTML = `<div style="font-family:'Space Mono',monospace; font-size:13px; color:var(--ink-soft);">Aucune sortie en attente. 👍</div>`;
    return;
  }
  el.innerHTML = pendingSorties.map(s=>`
    <div class="mod-item">
      <span class="flyer-cat ${catClass(s.cat)}">${s.cat}</span>
      <h4>${s.titre}</h4>
      <div class="mod-meta">${s.date} · ${s.heure} · ${s.ville}</div>
      <div class="mod-desc">${s.desc}</div>
      <div class="mod-actions">
        <button class="mod-approve" data-approve="${s.id}">✅ Publier</button>
        <button class="mod-reject" data-reject="${s.id}">🗑 Refuser</button>
      </div>
    </div>`).join('');
  el.querySelectorAll('[data-approve]').forEach(btn=>{
    btn.onclick = ()=> updateDoc(doc(db,'sorties',btn.dataset.approve), {status:'published'});
  });
  el.querySelectorAll('[data-reject]').forEach(btn=>{
    btn.onclick = ()=> deleteDoc(doc(db,'sorties',btn.dataset.reject));
  });
}

function renderBoard(){
  const el = document.getElementById('board');
  const list = getFilteredList();

  if(list.length===0){
    el.innerHTML = emptyStateHtml(false);
    bindSeedBtn(el);
    return;
  }

  el.innerHTML = list.map(s=>{
    const d = new Date(s.date + 'T00:00:00');
    const dateFmt = d.toLocaleDateString('fr-FR', {day:'2-digit', month:'short'});
    const votes = (s.votedBy||[]).length;
    const voted = currentUid ? (s.votedBy||[]).includes(currentUid) : false;
    const comCount = (s.commentaires||[]).length;
    return `
    <div class="flyer" data-id="${s.id}">
      ${s.images && s.images[0] ? `<img class="flyer-img" src="${s.images[0]}" alt="">` : ''}
      <span class="flyer-cat ${catClass(s.cat)}">${s.cat}</span>
      <h3>${s.titre}</h3>
      <div class="meta">${dateFmt} · ${s.heure}<br>${s.ville}</div>
      <div class="desc">${s.desc}</div>
      <div class="flyer-foot">
        <button class="vote-btn ${voted?'voted':''}" data-vote="${s.id}" ${CONFIG_READY?'':'disabled'}>🔥 ${votes}</button>
        <span class="comment-count">💬 ${comCount}</span>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('[data-vote]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); toggleVote(btn.dataset.vote); };
  });
  el.querySelectorAll('.flyer').forEach(card=>{
    card.onclick = ()=> openDetail(card.dataset.id);
  });
}

function renderScrollFeed(){
  const el = document.getElementById('scrollFeed');
  const list = getFilteredList();

  if(list.length===0){
    el.innerHTML = emptyStateHtml(true);
    bindSeedBtn(el);
    return;
  }

  el.innerHTML = list.map((s,i)=>{
    const d = new Date(s.date + 'T00:00:00');
    const dateFmt = d.toLocaleDateString('fr-FR', {weekday:'short', day:'2-digit', month:'short'});
    const imgs = s.images || [];
    const votes = (s.votedBy||[]).length;
    const voted = currentUid ? (s.votedBy||[]).includes(currentUid) : false;
    const comCount = (s.commentaires||[]).length;
    const expanded = expandedIds.has(s.id);
    const mediaHtml = imgs.length ? `
      <div class="scroll-media">
        <div class="media-strip">
          ${imgs.map(url=>`<div class="media-slide" style="background-image:url('${url}')"></div>`).join('')}
        </div>
      </div>
      <div class="scroll-overlay-gradient"></div>
      ${imgs.length>1 ? `<div class="media-dots">${imgs.map((_,di)=>`<span class="dot ${di===0?'active':''}"></span>`).join('')}</div>` : ''}
    ` : '';
    return `
    <div class="scroll-card sc-${s.cat} ${imgs.length?'has-media':''}" data-emoji="${CAT_EMOJI[s.cat]||'✨'}" data-id="${s.id}">
      ${mediaHtml}
      <div class="scroll-top">
        <span class="scroll-cat-tag">${CAT_EMOJI[s.cat]||''} ${s.cat}</span>
        <span class="scroll-counter">${i+1} / ${list.length}</span>
      </div>
      <h2>${s.titre}</h2>
      <div class="scroll-meta">${dateFmt} · ${s.heure}<br>📍 ${s.ville}</div>
      <div class="scroll-desc">${expanded ? (s.desc + ' ' + (s.extra||'')) : s.desc}</div>
      ${s.extra ? `<button class="desc-toggle" data-toggle="${s.id}">${expanded ? '− moins' : '+ plus'}</button>` : ''}
      <div class="scroll-actions">
        <button class="scroll-action-btn ${voted?'voted':''}" data-svote="${s.id}">🔥<span>${votes}</span></button>
        <button class="scroll-action-btn" data-scomment="${s.id}">💬<span>${comCount}</span></button>
        <button class="scroll-action-btn" data-spublish="1">✎<span>ajouter</span></button>
      </div>
      ${i===0 ? '<div class="scroll-hint">▲ glisse pour voir la suite ▲</div>' : ''}
    </div>`;
  }).join('');

  el.querySelectorAll('.media-strip').forEach(strip=>{
    strip.addEventListener('scroll', ()=>{
      const idx = Math.round(strip.scrollLeft / strip.clientWidth);
      const dotsWrap = strip.closest('.scroll-card').querySelector('.media-dots');
      if(dotsWrap){
        dotsWrap.querySelectorAll('.dot').forEach((d,di)=> d.classList.toggle('active', di===idx));
      }
    }, {passive:true});
  });

  el.querySelectorAll('[data-svote]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); toggleVote(btn.dataset.svote); };
  });
  el.querySelectorAll('[data-scomment]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); openDetail(btn.dataset.scomment); };
  });
  el.querySelectorAll('[data-spublish]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); openPublishForm(); };
  });
  el.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.dataset.toggle;
      if(expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
      renderScrollFeed();
    };
  });
}

async function toggleVote(id){
  if(!CONFIG_READY || !currentUid) return;
  const s = sorties.find(x=>x.id===id);
  if(!s) return;
  const voted = (s.votedBy||[]).includes(currentUid);
  try{
    await updateDoc(doc(db,'sorties',id), {
      votedBy: voted ? arrayRemove(currentUid) : arrayUnion(currentUid)
    });
  }catch(err){
    console.error(err);
    showConfigWarning("Erreur en votant : " + err.message);
  }
}

async function addComment(id, who, texte){
  try{
    await updateDoc(doc(db,'sorties',id), {
      commentaires: arrayUnion({who: who || "Anonyme", texte})
    });
  }catch(err){
    console.error(err);
    showConfigWarning("Erreur en commentant : " + err.message);
  }
}

function openDetail(id){
  const s = sorties.find(x=>x.id===id);
  if(!s) return;
  const d = new Date(s.date + 'T00:00:00');
  const dateFmt = d.toLocaleDateString('fr-FR', {weekday:'long', day:'2-digit', month:'long'});
  const votes = (s.votedBy||[]).length;
  const voted = currentUid ? (s.votedBy||[]).includes(currentUid) : false;
  const comments = s.commentaires || [];
  document.getElementById('modalRoot').innerHTML = `
  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="close" id="closeModal">✕ fermer</button>
      <span class="flyer-cat ${catClass(s.cat)}">${s.cat}</span>
      <h2>${s.titre}</h2>
      <div class="detail-meta">${dateFmt} · ${s.heure}<br>📍 ${s.ville}</div>
      <div class="detail-desc">${s.desc}${s.extra ? ' ' + s.extra : ''}</div>
      <div class="flyer-foot" style="margin-bottom:14px;">
        <button class="vote-btn ${voted?'voted':''}" data-vote="${s.id}" ${CONFIG_READY?'':'disabled'}>🔥 ${votes} — j'y vais</button>
      </div>
      <div class="comments">
        <div id="commentsList">
          ${comments.map(c=>`<div class="comment"><span class="who">${c.who}</span>${c.texte}</div>`).join('') || '<div class="comment" style="color:#5a4c3899;">Aucun commentaire pour l’instant.</div>'}
        </div>
        <div class="comment-form">
          <input type="text" id="commentName" class="comment-name" placeholder="Ton prénom">
          <input type="text" id="newComment" placeholder="Ajouter un commentaire...">
          <button id="addCommentBtn" ${CONFIG_READY?'':'disabled'}>Envoyer</button>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };
  document.getElementById('closeModal').onclick = closeModal;
  document.querySelector('[data-vote="'+id+'"]').onclick = ()=> toggleVote(id);
  document.getElementById('addCommentBtn').onclick = ()=>{
    const val = document.getElementById('newComment').value.trim();
    if(!val) return;
    const who = document.getElementById('commentName').value.trim();
    addComment(id, who, val);
    closeModal();
  };
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

function openPublishForm(){
  if(!CONFIG_READY){
    alert("Configure ta clé Firebase dans le code (objet firebaseConfig) avant de pouvoir publier.");
    return;
  }
  document.getElementById('modalRoot').innerHTML = `
  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="close" id="closeModal">✕ fermer</button>
      <h2>Publier une sortie</h2>
      <label>Titre</label><input type="text" id="f-titre" placeholder="Ex : Marché aux santons">
      <label>Catégorie</label>
      <select id="f-cat">${CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      <label>Ville</label>
      <select id="f-ville">${VILLES.map(v=>`<option value="${v}">${v}</option>`).join('')}</select>
      <label>Date</label><input type="date" id="f-date" value="${todayStr()}">
      <label>Horaire</label><input type="text" id="f-heure" placeholder="Ex : 18h–22h">
      <label>Description</label><textarea id="f-desc" placeholder="Quelques mots pour donner envie d'y aller..."></textarea>
      <label>Détails supplémentaires (optionnel, affichés via "+ plus")</label>
      <textarea id="f-extra" placeholder="Infos pratiques : parking, horaires, inscription..."></textarea>
      <div style="margin-top:14px; font-family:'Space Mono',monospace; font-size:11.5px; color:var(--ink-soft); background:#fffdf6; border:1px dashed #b6935c88; border-radius:4px; padding:10px;">
        📷 Ajout de photos temporairement désactivé (en attente de l'activation de Firebase Storage).
      </div>
      ${isAdmin ? '' : `<div style="margin-top:10px; font-family:'Space Mono',monospace; font-size:11.5px; color:var(--ink-soft);">ℹ️ Ta sortie sera visible après validation par un modérateur.</div>`}
      <button class="submit" id="f-submit">${isAdmin ? 'Publier sur le panneau' : 'Soumettre pour validation'}</button>
    </div>
  </div>`;
  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };
  document.getElementById('closeModal').onclick = closeModal;

  document.getElementById('f-submit').onclick = async ()=>{
    const titre = document.getElementById('f-titre').value.trim();
    if(!titre){ document.getElementById('f-titre').focus(); return; }
    const submitBtn = document.getElementById('f-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Publication...';
    try{
      await addDoc(collection(db,'sorties'), {
        titre,
        cat: document.getElementById('f-cat').value,
        ville: document.getElementById('f-ville').value,
        date: document.getElementById('f-date').value || todayStr(),
        heure: document.getElementById('f-heure').value || "à préciser",
        desc: document.getElementById('f-desc').value || "Pas de description.",
        extra: document.getElementById('f-extra').value.trim() || null,
        images: [],
        status: isAdmin ? 'published' : 'pending',
        votedBy: [],
        commentaires: [],
        createdAt: serverTimestamp()
      });
      closeModal();
    }catch(err){
      console.error(err);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Publier sur le panneau';
      showConfigWarning("Erreur à la publication : " + err.message);
    }
  };
}

document.getElementById('openPublish').onclick = openPublishForm;
document.getElementById('modeBoard').onclick = ()=>{ viewMode='board'; render(); };
document.getElementById('modeScroll').onclick = ()=>{ viewMode='scroll'; render(); };

function render(){
  renderModeToggle();
  renderAdminBadge();
  renderFilters();
  renderBoard();
  renderScrollFeed();
}
render();
</script>
</body>
</html>
