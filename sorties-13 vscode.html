<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Panneau — Sorties dans les Bouches-du-Rhône</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --board: #cdae78;
      --board-groove: #b6935c;
      --paper: #f7efdc;
      --paper-shadow: #00000030;
      --ink: #2c2317;
      --ink-soft: #5a4c38;
      --ochre: #c25a25;
      --lavender: #6c5b8f;
      --cyprus: #3f5c44;
      --azure: #2c6b86;
      --pin: #8a2f22;
      --teal: #2f8f7a;
      --paper-alt: #f0e6cd;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    html, body { height: 100%; }
    .app {
      font-family: Fraunces, serif;
      color: var(--ink);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      background:
        repeating-linear-gradient(90deg,
          var(--board) 0 3px,
          var(--board-groove) 3px 4px),
        radial-gradient(circle at 10% 20%, #00000012 0, transparent 40%),
        radial-gradient(circle at 80% 60%, #00000010 0, transparent 45%);
    }
    .content.mode-scroll {
      overflow: hidden;
      background: #0c0c0c;
    }
    .topbar {
      flex: 0 0 auto;
      z-index: 40;
      background: linear-gradient(180deg, #241a10 0%, #1a130b 100%);
      color: #f3e6c8;
      padding: 18px 24px 14px;
      box-shadow: 0 4px 12px #00000055;
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      flex-wrap: wrap;
      gap: 8px;
    }
    .mode-toggle {
      display: flex;
      gap: 6px;
    }
    .mode-pill.active {
      background: var(--cyprus);
      border-color: var(--cyprus);
      color: #fff8ec;
    }
    .brand {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 34px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #f3e6c8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--ochre);
      box-shadow: 0 0 0 3px #f3e6c822;
    }
    .tagline {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: #c9b78f;
      letter-spacing: 0.5px;
    }
    .filters {
      max-width: 1100px;
      margin: 14px auto 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filters select,
    .filters input[type="text"] {
      font-family: 'Space Mono', monospace;
      background: #2f2416;
      color: #f3e6c8;
      border: 1px solid #4a3a24;
      padding: 8px 10px;
      border-radius: 3px;
      font-size: 13px;
    }
    .pill {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #4a3a24;
      background: #2f2416;
      color: #e6d6ae;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }
    .pill.active {
      background: var(--ochre);
      color: #fff8ec;
      border-color: var(--ochre);
      transform: translateY(-1px);
    }
    .pill:hover {
      transform: translateY(-1px);
    }
    .sort-toggle {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .board {
      max-width: 1100px;
      margin: 34px auto;
      padding: 0 24px 90px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 30px 26px;
    }
    .flyer {
      position: relative;
      background: var(--paper);
      padding: 16px 16px 14px;
      box-shadow:
        0 10px 18px -6px var(--paper-shadow),
        0 2px 4px #0000002a;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .flyer::before {
      content: '';
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #d4664f, var(--pin) 70%);
      box-shadow: 0 3px 4px #00000060;
    }
    .flyer:nth-child(3n)   { transform: rotate(-2.4deg); }
    .flyer:nth-child(3n+1) { transform: rotate(1.6deg); }
    .flyer:nth-child(3n+2) { transform: rotate(-1deg); }
    .flyer:hover {
      transform: rotate(0deg) translateY(-3px) scale(1.015);
      box-shadow: 0 16px 26px -8px #00000045;
    }
    .flyer-cat {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      padding: 3px 8px;
      margin-bottom: 10px;
    }
    .flyer-ville-tag {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: var(--ochre);
      white-space: nowrap;
    }
    .cat-Marché      { background: var(--cyprus); }
    .cat-Concert     { background: var(--lavender); }
    .cat-Fête        { background: var(--ochre); }
    .cat-Nature      { background: var(--azure); }
    .cat-Expo        { background: #8a6b3f; }
    .cat-Feu         { background: var(--pin); }
    .cat-Découverte  { background: var(--teal); }
    .flyer h3 {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 700;
      font-size: 23px;
      line-height: 1.05;
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .flyer .meta {
      font-family: 'Space Mono', monospace;
      font-size: 11.5px;
      color: var(--ink-soft);
      margin-bottom: 6px;
      line-height: 1.6;
    }
    .flyer-address {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--azure);
      margin-bottom: 10px;
    }
    .flyer .desc {
      font-size: 14px;
      color: var(--ink-soft);
      line-height: 1.4;
      margin-bottom: 14px;
      font-style: italic;
    }
    .flyer-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed #00000030;
      padding-top: 10px;
    }
    .vote-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--ink);
      padding: 5px 10px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--ink);
      transition: all .15s ease;
    }
    .vote-btn.voted {
      background: var(--ochre);
      border-color: var(--ochre);
      color: #fff8ec;
    }
    .vote-btn:hover {
      transform: scale(1.05);
    }
    .vote-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .comment-count {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--ink-soft);
    }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      font-family: 'Space Mono', monospace;
      color: #5a4c3899;
    }
    .loading-pulse {
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 0.9; }
    }
    .seed-btn {
      margin-top: 14px;
      background: var(--cyprus);
      color: #fff8ec;
      border: none;
      padding: 9px 16px;
      border-radius: 20px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      cursor: pointer;
    }
    .fab {
      position: fixed;
      bottom: 26px;
      right: 26px;
      z-index: 50;
      background: var(--ochre);
      color: #fff8ec;
      border: none;
      border-radius: 50px;
      padding: 16px 22px;
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 18px #00000055;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform .15s ease;
    }
    .fab:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: #1a130bcc;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal {
      background: var(--paper);
      max-width: 520px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 26px 26px 22px;
      position: relative;
      box-shadow: 0 20px 50px #00000070;
    }
    .modal h2 {
      font-family: 'Big Shoulders Display', sans-serif;
      text-transform: uppercase;
      font-size: 26px;
      margin: 6px 0 12px;
    }
    .modal .close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--ink-soft);
      font-family: 'Space Mono', monospace;
    }
    .modal label {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--ink-soft);
      margin: 14px 0 5px;
    }
    .modal input,
    .modal select,
    .modal textarea {
      width: 100%;
      font-family: Fraunces, serif;
      font-size: 14px;
      padding: 8px 10px;
      border: 1px solid #b6935c88;
      background: #fffdf6;
      border-radius: 2px;
    }
    .modal textarea {
      resize: vertical;
      min-height: 70px;
    }
    .modal .submit {
      margin-top: 18px;
      background: var(--cyprus);
      color: #fff8ec;
      border: none;
      padding: 10px 18px;
      border-radius: 3px;
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .modal .submit:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .detail-meta {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 6px;
      line-height: 1.7;
    }
    .detail-address {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--azure);
      margin-bottom: 12px;
    }

      font-size: 15px;
